# Guardian merchant policy — see ARCHITECTURE-DETAIL.md section 5.3.
# Changing the auto-approve threshold is a standing instruction: it must be
# confirmed in the UI, never inferred from chat.
approvals:
  default: require_human
  auto_below_usd: 0
  expire_after_hours: 24
collections:
  max_rung: 3
  min_gap_hours_between_reminders: 24
holds:
  alert_min_usd: 0
risk:
  window_days: 30
  watch_dispute_rate: 0.03
  high_dispute_rate: 0.06
  watch_at_risk_usd: 250
  high_at_risk_usd: 1000
  deadline_watch_hours: 72
  deadline_high_hours: 48
scam:
  caution_at: 3
  likely_scam_at: 5
notifications:
  instant: [dispute_new, deadline_lt_48h, scam_suspect, hold_placed]
  daily_digest_at: "08:00"
  quiet_hours: "22:00-07:00"
watchers:
  deadline_scan: "every 1h"
  hold_scan: "daily 07:30"
  overdue_scan: "daily 08:30"
